# Demo deployment: docker-compose.prod.yml plus HTTPS and no published ports except 80/443.
# Self-hosters keep using docker-compose.prod.yml on its own; this file only adds to it.
# Usage (repo root): docker compose -f docker-compose.prod.yml -f deploy/demo/docker-compose.yml --env-file deploy/demo/.env up -d --build
# Setup and nightly reset: deploy/demo/README.md

# The frontend logs each sign-in with the visitor's e-mail: keep at most 30 MB per container
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  frontend:
    # Only Caddy talks to the app; Postgres, backend and Ollama stay inside the Docker network
    ports: !reset []
    logging: *logging
    environment:
      # The demo notice on every page, its section in the help and in the privacy statement (#162, #675)
      - DEMO=on
      # the demo refuses to start without its operator: the privacy statement names the controller, the notice its contact (#1170)
      - OPERATOR_NAME=${OPERATOR_NAME:?set OPERATOR_NAME in deploy/demo/.env}
      - OPERATOR_CONTACT=${OPERATOR_CONTACT:?set OPERATOR_CONTACT in deploy/demo/.env}

  backend:
    ports: !reset []
    logging: *logging
    environment:
      # No Sicherung: it would keep the visitors' data for up to 12 months, past the nightly reset (#675, fach review R-1)
      - BACKUP_DIR=

  postgres:
    ports: !reset []
    logging: *logging

  secrets:
    environment:
      # the demo refuses to start without its own database password; init-secrets.sh hands it to Postgres (#577)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/demo/.env}

  ollama:
    ports: !reset []
    logging: *logging

  caddy:
    image: caddy:2-alpine
    container_name: dwello-caddy
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DEMO_DOMAIN=${DEMO_DOMAIN}
    volumes:
      # Relative paths resolve against the first compose file, the repo root
      - ./deploy/demo/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - frontend
    networks:
      - dwello-network

volumes:
  caddy_data:
