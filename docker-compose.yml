version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dwello-postgres
    environment:
      POSTGRES_USER: dwello
      POSTGRES_PASSWORD: dwello
      POSTGRES_DB: dwello
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dwello -d dwello"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Ollama for LLM categorization (optional - uncomment when needed)
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: dwello-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama

volumes:
  postgres_data:
  # ollama_data:
