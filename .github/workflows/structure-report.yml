name: Structure report

# Structure report with its history on every push to main (bun run structure:report, docs/architecture/fitness-functions.md):
# the HTML report as an artifact, the history as a table in the job summary. A report, never a gate.
# Snapshots of earlier commits never change, so they are cached between runs; a lost cache only costs time.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Jobs read the repository only (CodeQL actions/missing-workflow-permissions)
permissions:
  contents: read

concurrency:
  group: structure-report
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  report:
    name: Structure report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # snapshots of earlier commits and fallow's hotspots need the full history
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/structure/history
          # snapshots stay valid while the tools that measure them do not change (structure-history.sh checks it too)
          key: structure-history-${{ hashFiles('tools/arch-baseline/*.ts', 'tools/arch-baseline/*.sh', 'tools/arch-baseline/layers.json', '.fallowrc.json', 'bun.lock') }}-${{ github.sha }}
          restore-keys: structure-history-${{ hashFiles('tools/arch-baseline/*.ts', 'tools/arch-baseline/*.sh', 'tools/arch-baseline/layers.json', '.fallowrc.json', 'bun.lock') }}-
      - run: bun run structure:report
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: structure-report
          path: build/structure/index.html
          retention-days: 90
