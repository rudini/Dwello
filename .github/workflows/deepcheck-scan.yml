name: Deep-module scan

# Ranked list of shallow modules in the whole codebase (tools/deepcheck), legacy included.
# Manual only and never blocking; the gate on changed code runs in CI (step "Deep modules" of the job "Lint and types").
on:
  workflow_dispatch:
    inputs:
      path:
        description: Directory or file to scan (empty for the whole project)
        required: false
        default: ''
      top:
        description: Number of modules to list
        required: false
        default: '50'
      min_score:
        description: Lowest score to list (35 lists the modules worth a look; empty lists flagged modules only, see tools/deepcheck/deepcheck-validation.md)
        required: false
        default: '35'
  # schedule:
  #   - cron: '0 6 * * 1' # Mondays 06:00 UTC

# Jobs read the repository only, unless they ask for more themselves (CodeQL actions/missing-workflow-permissions)
permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  scan:
    name: Deep-module scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bunx svelte-kit sync
      - name: Scan
        env:
          SCAN_PATH: ${{ inputs.path }}
          SCAN_TOP: ${{ inputs.top || '50' }}
          SCAN_MIN_SCORE: ${{ inputs.min_score }}
        run: |
          args=(--top "$SCAN_TOP")
          if [ -n "$SCAN_MIN_SCORE" ]; then args+=(--min-score "$SCAN_MIN_SCORE"); fi
          # The path comes last, after --, so an input like --output=... stays a path
          path=()
          if [ -n "$SCAN_PATH" ]; then path=(-- "$SCAN_PATH"); fi
          mkdir -p deepcheck-report
          bun run deepcheck:scan -- "${args[@]}" --format markdown --output deepcheck-report/deepcheck.md "${path[@]}"
          bun run deepcheck:scan -- "${args[@]}" --format json --output deepcheck-report/deepcheck.json "${path[@]}"
          cat deepcheck-report/deepcheck.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deepcheck-report
          path: deepcheck-report/
          retention-days: 30
