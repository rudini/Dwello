name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  # On pull requests: which parts the change touches, so tests of untouched parts are skipped; pushes to main run everything
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      app: ${{ steps.diff.outputs.app }}
      ui: ${{ steps.diff.outputs.ui }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT" && echo "app=true" >> "$GITHUB_OUTPUT" && echo "ui=true" >> "$GITHUB_OUTPUT" && exit 0
          fi
          git diff --name-only --no-renames "origin/${{ github.base_ref }}...HEAD" | tee changed.txt
          # The API contracts are checked against the backend (api-contracts.pg.test.ts)
          echo "backend=$(grep -qE '^(backend|tests/contracts)/' changed.txt && echo true || echo false)" >> "$GITHUB_OUTPUT"
          # Anything but documentation can change what the app does
          echo "app=$(grep -qvE '^(docs/|screens/|\.claude/)|\.md$' changed.txt && echo true || echo false)" >> "$GITHUB_OUTPUT"
          # What the axe check sees: frontend code (not its unit tests), texts, styles, build config, dependencies, the check itself
          ui_files=$(grep -vE '(^|/)__tests__/|\.(test|spec)\.ts$|\.md$|^tests/e2e/features/' changed.txt | grep -E '^(src|messages|static|project\.inlang|tests/a11y|tests/e2e)/|^(tailwind|postcss|svelte|vite|playwright)\.config\.(js|ts)$|^(package\.json|bun\.lock|tsconfig\.json|\.github/workflows/ci\.yml)$' || true)
          echo "ui=$([ -n "$ui_files" ] || grep -qx tests/e2e/features/accessibility.feature changed.txt && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: backend
      - name: Build frontend
        run: bun run build
      - name: Build backend
        run: bun run build
        working-directory: backend

  static-checks:
    name: Lint and types
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the scenario check diffs against the base branch
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: backend
      # ESLint covers frontend and backend; svelte-check the frontend types, tsc the backend types
      - run: bun run lint
      - run: bun run check
      - run: bun run type-check
        working-directory: backend
      # An installation has applied every migration on the base branch and would not see a change to one (backend/CLAUDE.md)
      - name: Migrations unchanged
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only --diff-filter=a "origin/${{ github.base_ref }}...HEAD" -- backend/migrations)
          if [ -n "$changed" ]; then
            echo "::error::Applied migrations changed: ${changed//$'\n'/, }. Put the change into a new numbered file in backend/migrations (backend/CLAUDE.md)."
            exit 1
          fi
      # Every TODO(fachlich prüfen, #n) marker names an open issue (CLAUDE.md, "Open work")
      - run: node tools/open-work/check-issues.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}

  unit-tests:
    name: Unit tests
    needs: changes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dwello
          POSTGRES_PASSWORD: dwello
          POSTGRES_DB: dwello
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dwello"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: backend
      - name: Frontend unit tests
        # All tests, so the coverage thresholds in vitest.config.ts apply to the whole frontend
        run: bun run test:coverage
      - name: Backend unit tests
        if: ${{ !cancelled() && needs.changes.outputs.backend == 'true' }}
        run: bun run test
        working-directory: backend

  # The axe check (@a11y, every screen and state in tests/a11y/screens.json) runs as its own check, so it can be required on its own
  e2e-tests:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: E2E tests
            filter: --grep-invert @a11y
            reports: e2e-reports
          - name: Accessibility (axe)
            filter: --project=chromium --grep @a11y
            reports: a11y-reports
    # A pull request that changes nothing the axe check sees skips its steps; the check still reports, as passed
    env:
      SKIP: ${{ matrix.reports == 'a11y-reports' && needs.changes.outputs.ui != 'true' }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dwello
          POSTGRES_PASSWORD: dwello
          POSTGRES_DB: dwello
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dwello"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: No UI change
        if: env.SKIP == 'true'
        run: echo "::notice::No file the axe check sees changed, so it is skipped."
      - uses: actions/checkout@v4
        if: env.SKIP != 'true'
      - uses: actions/setup-node@v4
        if: env.SKIP != 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
        if: env.SKIP != 'true'
      - run: bun install --frozen-lockfile
        if: env.SKIP != 'true'
      - run: bun install --frozen-lockfile
        if: env.SKIP != 'true'
        working-directory: backend
      # Pull requests: Chromium and the API driver only; pushes to main: every browser and the API driver
      - name: Install Playwright browsers
        if: env.SKIP != 'true'
        run: bunx playwright install --with-deps ${{ (github.event_name == 'pull_request' || matrix.reports == 'a11y-reports') && 'chromium' || '' }}
      - name: ${{ matrix.name }}
        if: env.SKIP != 'true'
        run: bun run test:e2e -- ${{ matrix.filter }} ${{ github.event_name == 'pull_request' && matrix.reports == 'e2e-reports' && '--project=chromium --project=api' || '' }}
      - name: Upload reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.reports }}
          path: |
            playwright-report/
            cucumber-report/
            test-results/
          retention-days: 7

  fallow:
    name: Fallow audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # tsconfig.json extends .svelte-kit/tsconfig.json: without it Fallow cannot resolve $lib imports
      - run: bunx svelte-kit sync
      - name: Fallow audit
        # Pull requests: changes against the target branch; pushes: changes of the pushed commits
        run: bunx fallow audit --base "${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}"

  # New or worsened shallow modules in the changed code (tools/deepcheck), with annotations and a step summary
  deepcheck:
    name: Deep modules
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # $lib comes from .svelte-kit/tsconfig.json; without it the import graph misses most imports
      - run: bunx svelte-kit sync
      - name: Deep-module gate
        run: bun run deepcheck:ci -- "origin/${{ github.base_ref }}"

  ui-screenshots:
    name: UI screenshots
    # Screenshots of every page a pull request changes, posted as a comment on the pull request
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dwello
          POSTGRES_PASSWORD: dwello
          POSTGRES_DB: dwello
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dwello"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Find changed pages
        id: routes
        run: |
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" | bun tests/ui-screenshots/affected-routes.ts > ui-routes.txt
          cat ui-routes.txt
          echo "any=$(grep -q . ui-routes.txt && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "pages=$(grep -q '^/' ui-routes.txt && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "pdf=$(grep -qx pdf ui-routes.txt && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.routes.outputs.any == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
      - if: steps.routes.outputs.any == 'true'
        run: bun install --frozen-lockfile
      - if: steps.routes.outputs.any == 'true'
        run: bun install --frozen-lockfile
        working-directory: backend
      - name: Install Playwright browser
        if: steps.routes.outputs.any == 'true'
        run: bunx playwright install --with-deps chromium
      - name: Check out the base branch to mark changes against
        if: steps.routes.outputs.any == 'true'
        run: |
          git worktree add ../base "origin/${{ github.base_ref }}"
          cd ../base && bun install --frozen-lockfile
      - name: Take screenshots
        if: steps.routes.outputs.pages == 'true'
        run: bunx playwright test -c playwright.screenshots.config.ts
        env:
          UI_BASE_DIR: ${{ github.workspace }}/../base
      # The statement PDF is drawn by the backend: a fixed example in German and French, against the base branch's code
      - name: Take screenshots of the statement PDF
        if: steps.routes.outputs.pdf == 'true'
        run: |
          sudo apt-get update -q && sudo apt-get install -y --no-install-recommends poppler-utils
          (cd ../base/backend && bun install --frozen-lockfile)
          bun tests/ui-screenshots/statement-pdf.ts
        env:
          UI_BASE_DIR: ${{ github.workspace }}/../base
      - name: Publish screenshots to branch ui-screenshots
        if: steps.routes.outputs.any == 'true'
        env:
          DIR: pr-${{ github.event.pull_request.number }}/${{ github.event.pull_request.head.sha }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # every affected page looks as on the base branch: nothing to publish
          ls ui-screenshots/*.png >/dev/null 2>&1 || exit 0
          if git fetch origin ui-screenshots; then git worktree add -B ui-screenshots ../shots FETCH_HEAD; else git worktree add --orphan -b ui-screenshots ../shots; fi
          mkdir -p "../shots/$DIR" && cp ui-screenshots/*.png "../shots/$DIR/"
          cd ../shots && git add . && git commit -m "chore(ci): screenshots for $DIR"
          for attempt in 1 2 3; do git push origin ui-screenshots && break; git pull --rebase origin ui-screenshots; done
      - name: Comment on pull request
        if: steps.routes.outputs.any == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const pr = context.payload.pull_request;
            const base = `https://github.com/${context.repo.owner}/${context.repo.repo}/blob/ui-screenshots/pr-${pr.number}/${pr.head.sha}`;
            const marker = '<!-- ui-screenshots -->';
            const shot = (title, name) => {
              const before = fs.existsSync(`ui-screenshots/${name}.before.png`)
                ? `\n<details><summary>Before</summary>\n\n![${title} before](${base}/${name}.before.png?raw=true)\n</details>`
                : '\n_New page, nothing to compare with._';
              return `### ${title}\n![${title}](${base}/${name}.png?raw=true)${before}`;
            };
            // the statement PDF (statement-pdf.ts): pdf_<language>_<page>.png
            const pdfPages = fs.readdirSync('ui-screenshots').filter((file) => /^pdf_\w+_\d+\.png$/.test(file)).sort();
            // PDF pages that look the same (statement-pdf.ts): pdf_<language>_<page>
            const samePdfPages = fs.existsSync('ui-screenshots/unchanged.txt')
              ? fs.readFileSync('ui-screenshots/unchanged.txt', 'utf8').split('\n').filter(Boolean).sort()
              : [];
            const pdfTitle = (name) => {
              const [, language, page] = name.match(/^pdf_(\w+)_(\d+)/);
              return `Statement PDF (${language}), page ${page}`;
            };
            // a page that looks the same as on the base branch has no screenshot (looksTheSame)
            const unchanged = [];
            const shots = fs.readFileSync('ui-routes.txt', 'utf8').split('\n').filter(Boolean).flatMap((route) => {
              if (route === 'pdf') {
                unchanged.push(...samePdfPages.map(pdfTitle));
                return pdfPages.map((file) => shot(pdfTitle(file), file.replace('.png', '')));
              }
              const name = route.split(/[/[\]]+/).filter(Boolean).join('_') || 'home';
              if (!fs.existsSync(`ui-screenshots/${name}.png`)) return (unchanged.push(`\`${route}\``), []);
              return [shot(`\`${route}\``, name)];
            });
            const same = unchanged.length ? `\n\nLook the same as on ${pr.base.ref}: ${unchanged.join(', ')}.` : '';
            const body = shots.length
              ? `${marker}\n## UI screenshots\nChanged pages as of ${pr.head.sha.slice(0, 7)}; changes against ${pr.base.ref} are framed in red:\n\n${shots.join('\n\n')}${same}`
              : `${marker}\n## UI screenshots\nNo visible changes as of ${pr.head.sha.slice(0, 7)}.${same}`;
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: pr.number });
            const existing = comments.find((comment) => comment.body?.startsWith(marker));
            if (existing) await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: pr.number, body });
