name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Nightly: the full run on main again, for tests that depend on the date
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

concurrency:
  # the nightly run neither replaces nor is replaced by a waiting push to main
  group: ci-${{ github.ref }}-${{ github.event_name }}
  # A newer push to a pull request replaces its run; on main every run finishes and only the newest waiting one is kept,
  # so quick merges are tested together instead of cancelling each other
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Jobs read the repository only, unless they ask for more themselves (CodeQL actions/missing-workflow-permissions)
permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  # On pull requests: which parts the change touches, so tests of untouched parts are skipped; a push that changes only
  # documentation since a green run of its branch skips the tests that run passed. Pushes to main run everything: a pull
  # request need not be up to date with main, so main is where pull requests merged side by side meet.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      app: ${{ steps.diff.outputs.app }}
      ui: ${{ steps.diff.outputs.ui }}
      playwright: ${{ steps.diff.outputs.playwright }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # the Playwright version the lockfile pins, so the E2E jobs run in its image (#777)
          echo "playwright=$(sed -n 's/.*"playwright": \["playwright@\([0-9.]*\)".*/\1/p' bun.lock | head -1)" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != pull_request ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT" && echo "app=true" >> "$GITHUB_OUTPUT" && echo "ui=true" >> "$GITHUB_OUTPUT" && exit 0
          fi
          green=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?event=pull_request&status=success&per_page=100" \
            -f branch="$HEAD_REF" -X GET --jq '.workflow_runs[].head_sha' || true)
          if node tools/ci/docs-only-since.mjs "${{ github.event.pull_request.head.sha }}" $green; then
            echo "::notice::Only documentation changed since the last green run of this branch, so its tests are skipped."
            echo "backend=false" >> "$GITHUB_OUTPUT" && echo "app=false" >> "$GITHUB_OUTPUT" && echo "ui=false" >> "$GITHUB_OUTPUT" && exit 0
          fi
          git diff --name-only --no-renames "origin/${{ github.base_ref }}...HEAD" | tee changed.txt
          # The API contracts are checked against the backend (api-contracts.pg.test.ts)
          echo "backend=$(grep -qE '^(backend|tests/contracts)/' changed.txt && echo true || echo false)" >> "$GITHUB_OUTPUT"
          # Anything but documentation can change what the app does
          echo "app=$(grep -qvE '^(docs/|\.claude/)|\.md$' changed.txt && echo true || echo false)" >> "$GITHUB_OUTPUT"
          # What the axe check sees: frontend code (not its unit tests), texts, styles, build config, dependencies, the check itself
          ui_files=$(grep -vE '(^|/)__tests__/|\.(test|spec)\.ts$|\.md$|^tests/e2e/features/' changed.txt | grep -E '^(src|messages|static|project\.inlang|tests/a11y|tests/e2e)/|^(tailwind|postcss|svelte|vite|playwright)\.config\.(js|ts)$|^(package\.json|bun\.lock|tsconfig\.json|\.github/workflows/ci\.yml)$' || true)
          echo "ui=$([ -n "$ui_files" ] || grep -qx tests/e2e/features/accessibility.feature changed.txt && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: backend
      - name: Build frontend
        run: bun run build
      - name: Build backend
        run: bun run build
        working-directory: backend

  static-checks:
    name: Lint and types
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the scenario check diffs against the base branch
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: backend
      # ESLint covers frontend and backend; svelte-check the frontend types, tsc the backend types
      - run: bun run lint
      - run: bun run check
      - run: bun run type-check
        working-directory: backend
      # An installation has applied every migration on the base branch and would not see a change to one (backend/CLAUDE.md)
      - name: Migrations unchanged
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only --diff-filter=a "origin/${{ github.base_ref }}...HEAD" -- backend/migrations)
          if [ -n "$changed" ]; then
            echo "::error::Applied migrations changed: ${changed//$'\n'/, }. Put the change into a new numbered file in backend/migrations (backend/CLAUDE.md)."
            exit 1
          fi
      # Contributors have no commit hook: CI checks the subjects as .claude/hooks/commit-msg-gate.mjs does (Dependabot's are exempt)
      - name: Commit subjects
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        run: |
          status=0
          while IFS= read -r subject; do
            node .claude/hooks/commit-msg-gate.mjs --check "$subject" || status=1
          done < <(git log --no-merges --format=%s "origin/${{ github.base_ref }}..HEAD")
          if [ $status != 0 ]; then echo "::error::Commit subjects break CLAUDE.md, Conventions (Commits); reword them, see the log."; fi
          exit $status
      # New files are Prettier-clean; existing ones are not all, and .prettierignore limits Prettier to src/
      - name: Prettier on new files
        if: github.event_name == 'pull_request'
        run: git diff --name-only --diff-filter=A -z "origin/${{ github.base_ref }}...HEAD" | xargs -0 -r bunx prettier --check --ignore-unknown
      # Every TODO(fachlich prüfen, #n) marker names an open issue (CLAUDE.md, "Open work"); a changed scenario without @wip is approved (Workflow 1)
      - run: node tools/open-work/check-issues.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}

  unit-tests:
    name: Unit tests
    needs: changes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dwello
          POSTGRES_PASSWORD: dwello
          POSTGRES_DB: dwello
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dwello"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the upgrade check starts from the previous release tag
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: backend
      - name: Frontend unit tests
        # All tests, so the coverage thresholds in vitest.config.ts apply to the whole frontend
        run: bun run test:coverage
      - name: Backend unit tests
        if: ${{ !cancelled() && needs.changes.outputs.backend == 'true' }}
        run: bun run test
        working-directory: backend
      # U1 (docs/architecture/fitness-functions.md): demo data of the previous release, migrated by this checkout, keeps every row
      - name: Upgrade from the previous release
        if: ${{ !cancelled() && needs.changes.outputs.backend == 'true' }}
        run: tools/fitness/upgrade-check.sh

  # The axe check (@a11y, every screen and state in tests/a11y/screens.json) runs as its own check, so it can be required on its own
  # Each runs in shards (Playwright --shard) on parallel runners; the job "e2e-results" reports each under its own name
  e2e-tests:
    name: ${{ matrix.name }} (${{ matrix.shard }}/${{ matrix.shards }})
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    # Pull requests: Chromium and the API driver only; every browser on each push to main and nightly, so a race only
    # Firefox or WebKit loses shows on main right after the merge
    timeout-minutes: 60
    # The Playwright image of the locked version brings the browsers and their system packages, so no apt install runs
    # at run time and a slow mirror cannot hold a shard up (#777); user 1001 owns the runner's workspace
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.changes.outputs.playwright }}-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        # E2E in five shards: Playwright splits by test count, and the slow screen checks (sprachen-bildschirme.feature)
        # would otherwise fill one shard that runs twice as long as the others; the axe check in three (5 to 8 minutes each in five)
        suite: [e2e, a11y]
        shard: [1, 2, 3, 4, 5]
        exclude:
          - { suite: a11y, shard: 4 }
          - { suite: a11y, shard: 5 }
        include:
          - { suite: e2e, name: E2E tests, filter: --grep-invert @a11y, reports: e2e-reports, shards: 5 }
          - { suite: a11y, name: Accessibility (axe), filter: --project=chromium --grep @a11y, reports: a11y-reports, shards: 3 }
    # A pull request that changes nothing the axe check sees skips its steps; the check still reports, as passed
    env:
      SKIP: ${{ matrix.reports == 'a11y-reports' && needs.changes.outputs.ui != 'true' }}
      # Pull requests: Chromium and the API driver; else the E2E tests in every browser (the axe check picks Chromium)
      PROJECTS: ${{ matrix.reports == 'e2e-reports' && github.event_name == 'pull_request' && '--project=api --project=chromium' || '' }}
      # inside the container the database is the service, not localhost
      E2E_DATABASE_URL: postgresql://dwello:dwello@postgres:5432/dwello_e2e
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dwello
          POSTGRES_PASSWORD: dwello
          POSTGRES_DB: dwello
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dwello"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: No UI change
        if: env.SKIP == 'true'
        run: echo "::notice::No file the axe check sees changed, so it is skipped."
      - uses: actions/checkout@v7
        if: env.SKIP != 'true'
      - uses: actions/setup-node@v7
        if: env.SKIP != 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
        if: env.SKIP != 'true'
      - run: bun install --frozen-lockfile
        if: env.SKIP != 'true'
      - run: bun install --frozen-lockfile
        if: env.SKIP != 'true'
        working-directory: backend
      - name: ${{ matrix.name }}
        if: env.SKIP != 'true'
        run: bun run test:e2e -- ${{ matrix.filter }} ${{ env.PROJECTS }} --shard=${{ matrix.shard }}/${{ matrix.shards }}
      - name: Upload reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.reports }}-${{ matrix.shard }}
          path: |
            playwright-report/
            cucumber-report/
            test-results/
          retention-days: 7

  # The checks "E2E tests" and "Accessibility (axe)" under their old names, so they can stay required: each passes only when all its shards did
  e2e-results:
    name: ${{ matrix.name }}
    needs: [changes, e2e-tests]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    strategy:
      # one check failing must not cancel the other (run 634)
      fail-fast: false
      matrix:
        include:
          - { name: E2E tests, shards: 5 }
          - { name: Accessibility (axe), shards: 3 }
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ needs.changes.result }}" != success ]; then echo "::error::The job Changes failed, so no shard ran."; exit 1; fi
          if [ "${{ needs.changes.outputs.app }}" != true ]; then exit 0; fi
          # every shard of both suites passed: no need to ask the API, which can still list a finished shard as running (PR #591)
          if [ "${{ needs.e2e-tests.result }}" = success ]; then exit 0; fi
          # three tries: one HTTP 502 of the API turned run 634 red with every shard green, and an answer
          # seconds after the last shard can still count fewer (PR #592: «1 of 3» with all three green)
          for attempt in 1 2 3; do
            passed=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" \
              --jq '[.jobs[] | select(.name | startswith("${{ matrix.name }} (")) | select(.conclusion == "success")] | length') \
              && [ "$passed" = "${{ matrix.shards }}" ] && break
            sleep 15
          done
          if [ "$passed" != "${{ matrix.shards }}" ]; then echo "::error::$passed of ${{ matrix.shards }} shards passed."; exit 1; fi

  fallow:
    name: Fallow audit
    # the nightly and manual runs have no commits to compare
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # tsconfig.json extends .svelte-kit/tsconfig.json: without it Fallow cannot resolve $lib imports
      - run: bunx svelte-kit sync
      - name: Fallow audit
        # Pull requests: changes against the target branch; pushes: changes of the pushed commits
        run: bunx fallow audit --base "${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}"

  # Architecture fitness functions (docs/architecture/fitness-functions.md): pull requests and main may not make a
  # measured value worse than tools/fitness/ratchet.json; the nightly run reports the co-change coupling of 6 months
  fitness:
    name: Architecture fitness
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Fitness functions
        run: |
          case "${{ github.event_name }}" in
            pull_request) bun tools/fitness/fitness.ts --base "origin/${{ github.base_ref }}" --format github ;;
            push) bun tools/fitness/fitness.ts --base "${{ github.event.before }}" --format github ;;
            *) bun tools/fitness/fitness.ts --format github && bun tools/fitness/fitness.ts --cochange --format github ;;
          esac

  # T1: wall clock of this run from its start to its last result (target 15 min on pull requests and main), and on the
  # nightly run the share of green push runs on main over 7 days; a report, never a failure (one run's time is noisy)
  ci-duration:
    name: CI duration
    needs: [changes, build, static-checks, unit-tests, e2e-results, fallow, fitness]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - continue-on-error: true # a report: an API or clock error must not turn the check red
        env:
          GH_TOKEN: ${{ github.token }}
          RUNS: repos/${{ github.repository }}/actions
        run: |
          started=$(gh api "$RUNS/runs/${{ github.run_id }}" --jq .run_started_at)
          minutes=$(( ($(date +%s) - $(date -d "$started" +%s)) / 60 ))
          echo "Fitness: CI wall clock ${minutes} min (${{ github.event_name }}, target 15 min)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$minutes" -gt 15 ]; then echo "::warning title=Fitness ci-duration::T1/AP5: this run took ${minutes} min, the target is 15 min. Fix: move rule variants from E2E to unit or *.pg.test.ts tests, or shorten the slowest job (critical path in the run's timing)."; fi
          if [ "${{ github.event_name }}" = schedule ]; then
            gh api "$RUNS/workflows/ci.yml/runs?branch=main&event=push&created=>=$(date -d '7 days ago' +%F)&per_page=100" \
              --jq '[.workflow_runs[] | select(.status == "completed" and .conclusion != "cancelled")] | "Fitness: green push runs on main in 7 days: \([.[] | select(.conclusion == "success")] | length) of \(length)"' \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  # A pull request that adds a dependency with a known high or critical vulnerability fails. It needs the dependency
  # graph, which a private repository only has with GitHub Advanced Security, so it runs once the repository is public
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  # New or worsened shallow modules in the changed code (tools/deepcheck), with annotations and a step summary
  deepcheck:
    name: Deep modules
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # $lib comes from .svelte-kit/tsconfig.json; without it the import graph misses most imports
      - run: bunx svelte-kit sync
      - name: Deep-module gate
        run: bun run deepcheck:ci -- "origin/${{ github.base_ref }}"

  ui-screenshots:
    name: UI screenshots
    # Screenshots of every page a pull request changes, posted as a comment on the pull request
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dwello
          POSTGRES_PASSWORD: dwello
          POSTGRES_DB: dwello
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dwello"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Find changed pages
        id: routes
        run: |
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" | bun tests/ui-screenshots/affected-routes.ts > ui-routes.txt
          cat ui-routes.txt
          echo "any=$(grep -q . ui-routes.txt && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "pages=$(grep -q '^/' ui-routes.txt && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "pdf=$(grep -qx pdf ui-routes.txt && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        if: steps.routes.outputs.any == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
      - if: steps.routes.outputs.any == 'true'
        run: bun install --frozen-lockfile
      - if: steps.routes.outputs.any == 'true'
        run: bun install --frozen-lockfile
        working-directory: backend
      - name: Install Playwright browser
        if: steps.routes.outputs.any == 'true'
        run: bunx playwright install --with-deps chromium
      - name: Check out the base branch to mark changes against
        if: steps.routes.outputs.any == 'true'
        run: |
          git worktree add ../base "origin/${{ github.base_ref }}"
          cd ../base && bun install --frozen-lockfile
      - name: Take screenshots
        if: steps.routes.outputs.pages == 'true'
        run: bunx playwright test -c playwright.screenshots.config.ts
        env:
          UI_BASE_DIR: ${{ github.workspace }}/../base
      # The statement PDF is drawn by the backend: a fixed example in German and French, against the base branch's code
      - name: Take screenshots of the statement PDF
        if: steps.routes.outputs.pdf == 'true'
        run: |
          sudo apt-get update -q && sudo apt-get install -y --no-install-recommends poppler-utils
          (cd ../base/backend && bun install --frozen-lockfile)
          bun tests/ui-screenshots/statement-pdf.ts
        env:
          UI_BASE_DIR: ${{ github.workspace }}/../base
      - name: Publish screenshots to branch ui-screenshots
        if: steps.routes.outputs.any == 'true'
        env:
          DIR: pr-${{ github.event.pull_request.number }}/${{ github.event.pull_request.head.sha }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # every affected page looks as on the base branch: nothing to publish
          ls ui-screenshots/*.png >/dev/null 2>&1 || exit 0
          if git fetch origin ui-screenshots; then git worktree add -B ui-screenshots ../shots FETCH_HEAD; else git worktree add --orphan -b ui-screenshots ../shots; fi
          mkdir -p "../shots/$DIR" && cp ui-screenshots/*.png "../shots/$DIR/"
          cd ../shots && git add . && git commit -m "chore(ci): screenshots for $DIR"
          for attempt in 1 2 3; do git push origin ui-screenshots && break; git pull --rebase origin ui-screenshots; done
      - name: Comment on pull request
        if: steps.routes.outputs.any == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const pr = context.payload.pull_request;
            const base = `https://github.com/${context.repo.owner}/${context.repo.repo}/blob/ui-screenshots/pr-${pr.number}/${pr.head.sha}`;
            const marker = '<!-- ui-screenshots -->';
            const shot = (title, name) => {
              const before = fs.existsSync(`ui-screenshots/${name}.before.png`)
                ? `\n<details><summary>Before</summary>\n\n![${title} before](${base}/${name}.before.png?raw=true)\n</details>`
                : '\n_New page, nothing to compare with._';
              return `### ${title}\n![${title}](${base}/${name}.png?raw=true)${before}`;
            };
            // the statement PDF (statement-pdf.ts): pdf_<language>_<page>.png
            const pdfPages = fs.readdirSync('ui-screenshots').filter((file) => /^pdf_\w+_\d+\.png$/.test(file)).sort();
            // PDF pages that look the same (statement-pdf.ts): pdf_<language>_<page>
            const samePdfPages = fs.existsSync('ui-screenshots/unchanged.txt')
              ? fs.readFileSync('ui-screenshots/unchanged.txt', 'utf8').split('\n').filter(Boolean).sort()
              : [];
            const pdfTitle = (name) => {
              const [, language, page] = name.match(/^pdf_(\w+)_(\d+)/);
              return `Statement PDF (${language}), page ${page}`;
            };
            // a page that looks the same as on the base branch has no screenshot (looksTheSame)
            const unchanged = [];
            const shots = fs.readFileSync('ui-routes.txt', 'utf8').split('\n').filter(Boolean).flatMap((route) => {
              if (route === 'pdf') {
                unchanged.push(...samePdfPages.map(pdfTitle));
                return pdfPages.map((file) => shot(pdfTitle(file), file.replace('.png', '')));
              }
              const name = route.split(/[/[\]]+/).filter(Boolean).join('_') || 'home';
              if (!fs.existsSync(`ui-screenshots/${name}.png`)) return (unchanged.push(`\`${route}\``), []);
              return [shot(`\`${route}\``, name)];
            });
            const same = unchanged.length ? `\n\nLook the same as on ${pr.base.ref}: ${unchanged.join(', ')}.` : '';
            const body = shots.length
              ? `${marker}\n## UI screenshots\nChanged pages as of ${pr.head.sha.slice(0, 7)}; changes against ${pr.base.ref} are framed in red:\n\n${shots.join('\n\n')}${same}`
              : `${marker}\n## UI screenshots\nNo visible changes as of ${pr.head.sha.slice(0, 7)}.${same}`;
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: pr.number });
            const existing = comments.find((comment) => comment.body?.startsWith(marker));
            if (existing) await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: pr.number, body });

  # A red run on main (after a push or nightly) opens the issue "CI auf main ist rot", or comments on it while it is open;
  # the next green run closes it. The session whose merge it was fixes it (skill pull-request, "After the merge").
  main-status:
    name: Main status
    needs: [changes, build, static-checks, unit-tests, e2e-tests, e2e-results, fallow, fitness]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="CI auf main ist rot"
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ "$RED" = true ]; then
            body="Der Lauf $RUN (${{ github.event_name }}, ${{ github.sha }}) ist fehlgeschlagen."
            if [ -n "$open" ]; then gh issue comment "$open" --body "$body"; else gh issue create --title "$title" --label bug --body "$body"; fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --reason completed --comment "Der Lauf $RUN (${{ github.sha }}) ist grün."
          fi
