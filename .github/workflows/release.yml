name: Release

# Weekly on Monday at 06:00 Swiss time, main gets the next version as a tag and a GitHub Release, unless nothing changed
# since the last one (#935, before every merge: #173); the app shows it in the footer (vite.config.ts), between releases
# with the commits since. Its images go to ghcr.io for compose.yaml (#578). A manual run on main releases now, with a
# version by hand if given, e.g. 1.0.0. Images that failed: «Re-run failed jobs», as a full re-run finds main tagged.
on:
  schedule:
    # 06:00 in Zurich is 05:00 UTC in winter and 04:00 UTC in summer; release.sh lets only the right one release
    - cron: '0 4 * * 1'
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: Version to release instead of the computed one, e.g. 1.0.0 (empty for the computed one)
        required: false

# One release at a time
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Tag and release
    # A manual run on another branch would tag a commit outside main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SCHEDULE: ${{ github.event.schedule }}
        run: tools/release/release.sh

  # The images compose.yaml starts (#578), for Intel and AMD (amd64) and ARM such as Apple silicon or a Raspberry Pi (arm64),
  # tagged with the version and «latest»; public with the repository, so no sign-in is needed to pull them
  images:
    name: Images
    needs: release
    # no release this week (no changes, or the cron that is not 06:00 in Zurich)
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          # the footer shows the version (vite.config.ts); .git is not in the build context; the backend takes no argument
          - part: frontend
            context: .
            file: Dockerfile
            args: APP_VERSION=v${{ needs.release.outputs.version }}
          - part: backend
            context: backend
            file: backend/Dockerfile
            args: ''
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: ${{ matrix.args }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/rudini/dwello-${{ matrix.part }}:${{ needs.release.outputs.version }}
            ghcr.io/rudini/dwello-${{ matrix.part }}:latest
